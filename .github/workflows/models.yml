# Weekly: fails when a model that Claude Code's CHANGELOG, Anthropic's,
# OpenAI's or Google's price page, Codex's model catalog or Gemini CLI's
# model list names has no price of its own in src/pricing.ts (it would be
# priced by its family's row, an estimate, or not at all), or when a row's
# price ends within 14 days with no successor price recorded (ROADMAP K1, E7).
# Hosts ship models days before a context-doctor release; this says so before
# users run them. A page that is down is a warning, not a failure.
# Read-only: no secrets, no writes.
name: Model prices

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Every model the hosts and price pages name has a price; no dated row ends without a successor
        run: >-
          node scripts/check-models.mjs
          --url https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
          --url https://platform.claude.com/docs/en/about-claude/pricing.md
          --openai https://developers.openai.com/api/docs/pricing.md
          --codex https://raw.githubusercontent.com/openai/codex/main/codex-rs/models-manager/models.json
          --google https://ai.google.dev/gemini-api/docs/pricing.md.txt
          --gemini-cli https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/models.ts
          --dated
