# Weekly: fails when a model that Claude Code's CHANGELOG, Anthropic's,
# OpenAI's or Google's price page, Codex's model catalog or Gemini CLI's
# model list names has no price of its own in src/pricing.ts (it would be
# priced by its family's row, an estimate, or not at all), or when a row's
# price ends within 14 days with no successor price recorded (ROADMAP K1, E7).
# Hosts ship models days before a context-doctor release; this says so before
# users run them. A page that is down is a warning, not a failure.
# Also a report, never a failure: what the newest Claude Code added to or
# removed from its environment variables, settings keys, plugin.json keys,
# hook and mod events since the reviewed list (docs/hosts-reviewed.json).
# Read-only: no secrets, no writes.
name: Model prices

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Every model the hosts and price pages name has a price; no dated row ends without a successor
        run: >-
          node scripts/check-models.mjs
          --url https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
          --url https://platform.claude.com/docs/en/about-claude/pricing.md
          --openai https://developers.openai.com/api/docs/pricing.md
          --codex https://raw.githubusercontent.com/openai/codex/main/codex-rs/models-manager/models.json
          --google https://ai.google.dev/gemini-api/docs/pricing.md.txt
          --gemini-cli https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/models.ts
          --dated

  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          # Claude Code's npm package needs Node 22 or later.
          node-version: 22
      - name: Install the newest Claude Code (npm, into a scratch prefix)
        run: npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@latest
      - name: What it adds or removes since the reviewed list (job summary)
        # A list to read, never a failure: the step also passes when the extractors need updating.
        continue-on-error: true
        run: >-
          node scripts/claude-surface.mjs
          --claude "$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          --changelog https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
          --summary "$GITHUB_STEP_SUMMARY"
