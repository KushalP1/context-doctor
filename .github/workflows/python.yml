name: Python

on:
  push:
    branches: [main]
    paths: ["python/**", "src/pack.ts", "src/tokens.ts", "scripts/gen-python-parity.mjs", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "src/pack.ts", "src/tokens.ts", "scripts/gen-python-parity.mjs", ".github/workflows/python.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest is Ubuntu 26.04 since 2026-10-19, and setup-python has
        # no 3.9 for it: the floor (requires-python >=3.9) is tested on 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and parity tests
        working-directory: python
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  # The fixtures must come from the TypeScript as it is now, or parity means nothing.
  fixtures-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node scripts/gen-python-parity.mjs && git diff --exit-code -- python/tests/parity.json
