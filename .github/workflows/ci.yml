name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push supersedes the old run instead of racing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung job must not sit on a runner for the default six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24] # every version package.json claims to support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test CLI on the bundled example
        shell: bash
        run: |
          node dist/cli.js analyze examples/sample-conversation.json --model claude-sonnet-5
          node dist/cli.js optimize examples/sample-conversation.json --out smoke-out.json
      - name: Verify committed dist/ is in sync with src/
        shell: bash
        run: git diff --exit-code -- dist
