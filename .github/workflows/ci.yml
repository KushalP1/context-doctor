name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22] # package.json claims >=18, so prove it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test CLI on the bundled example
        shell: bash
        run: |
          node dist/cli.js analyze examples/sample-conversation.json --model claude-sonnet-5
          node dist/cli.js optimize examples/sample-conversation.json --out smoke-out.json
      - name: Verify committed dist/ is in sync with src/
        shell: bash
        run: git diff --exit-code -- dist
