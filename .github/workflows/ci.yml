name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test CLI on the bundled example
        run: |
          node dist/cli.js analyze examples/sample-conversation.json --model claude-sonnet-5
          node dist/cli.js optimize examples/sample-conversation.json --out /dev/null
