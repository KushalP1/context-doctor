# Publishes python/ to PyPI on a `py-v*` tag, by trusted publishing (no token).
# One-time: on pypi.org add a pending trusted publisher for project
# "context-doctor": owner KushalP1, repo context-doctor, workflow publish-python.yml.
name: Release (Python)

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        working-directory: python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Build
        working-directory: python
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
