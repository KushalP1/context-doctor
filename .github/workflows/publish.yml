name: Release

# Tag vX.Y.Z (matching package.json) and push the tag. One tag does all of it:
#   1. npm publish, through npm TRUSTED PUBLISHING: npm verifies this workflow
#      by OIDC, so no token is stored anywhere. One-time setup on npmjs.com:
#      package context-doctor > Settings > Trusted Publisher > GitHub Actions,
#      owner KushalP1, repository context-doctor, workflow publish.yml.
#      (npm is phasing out tokens that bypass 2FA for publishing.) An NPM_TOKEN
#      secret still works as a fallback. With neither, or when the version is
#      already on npm, the step leaves a notice instead of failing the run.
#   2. The official MCP Registry, via GitHub OIDC (no secret), after npm.
#   3. A GitHub release with the Claude Desktop bundle (.mcpb) attached,
#      signed when MCPB_CERT and MCPB_KEY exist (PEM text of a code-signing
#      certificate from a trusted CA and its key; MCPB_INTERMEDIATE for the
#      chain). Unsigned bundles still install; Desktop shows a warning.
on:
  push:
    tags: ["v[0-9]*"]
  # Retry a release without a new tag: Actions > Release > Run workflow on
  # main publishes whatever version package.json holds, if npm lacks it.
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1
          fi
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "context-doctor@$V" version >/dev/null 2>&1; then
            echo "::notice::context-doctor@$V is already on npm; nothing to publish"; exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install -g npm@latest >/dev/null 2>&1 || echo "::warning::could not upgrade npm"
          echo "npm $(npm --version); OIDC token available: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no); NPM_TOKEN secret: $([ -n "$NPM_TOKEN" ] && echo set || echo absent)"
          # With no token, drop setup-node's empty _authToken line so npm takes the OIDC route.
          if [ -z "$NPM_TOKEN" ]; then unset NODE_AUTH_TOKEN; sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true; fi
          # The job already ran the suite; --ignore-scripts skips prepublishOnly's
          # second run, which also kept npm's own error off the end of the log.
          if npm publish --provenance --access public --ignore-scripts > publish.log 2>&1; then
            echo "Published context-doctor@$V"
          else
            cat publish.log
            REASON="$(npm --version): $(grep -E "npm (error|ERR!)" publish.log | head -4 | tr '\n' ' ')"
            if [ -z "$NPM_TOKEN" ]; then
              echo "::warning::npm publish was not authorized: ${REASON:-see log}. Set up trusted publishing (see the header of this workflow) or add NPM_TOKEN, then use Run workflow."
            else
              echo "::error::npm publish failed: ${REASON:-see log}"; exit 1
            fi
          fi

  mcp-registry:
    # The official MCP Registry (registry.modelcontextprotocol.io), which many
    # directories copy from. GitHub OIDC proves this workflow belongs to the
    # io.github.KushalP1 namespace, so no login or secret is needed. It checks
    # the published npm package's mcpName, so it runs after the npm job.
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish server.json
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          V="$(node -p "require('./package.json').version")"
          if ! npm view "context-doctor@$V" version >/dev/null 2>&1; then
            echo "::warning::context-doctor@$V is not on npm yet, and the registry checks the npm package; skipped"; exit 0
          fi
          ./mcp-publisher login github-oidc
          if ./mcp-publisher publish 2>publish.err; then
            echo "Published $(node -p "require('./server.json').name") to the MCP Registry"
          elif grep -qi "already exists\|duplicate\|cannot publish duplicate" publish.err; then
            echo "::notice::This version is already in the MCP Registry"
          else
            cat publish.err; echo "::error::MCP Registry: $(head -c 300 publish.err | tr '\n' ' ')"; exit 1
          fi

  github-release:
    # Tag pushes only: a manual run is a publish retry, not a new release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MCPB_CERT: ${{ secrets.MCPB_CERT }}
      MCPB_KEY: ${{ secrets.MCPB_KEY }}
      MCPB_INTERMEDIATE: ${{ secrets.MCPB_INTERMEDIATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mcpb
      - name: Release with the Claude Desktop bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v v="$V" '$0 ~ "^## Shipped in "v {f=1; next} /^## / && f {exit} f' ROADMAP.md)
          [ -n "$NOTES" ] || NOTES="See ROADMAP.md."
          printf '%s\n\n**Install:** `npm install -g context-doctor && context-doctor install && context-doctor autopilot on`. Claude Desktop: download the .mcpb below and open it.\n' "$NOTES" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "context-doctor $V" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" context-doctor-*.mcpb --clobber
